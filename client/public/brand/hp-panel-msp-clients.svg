<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="A multi-tenant console managing many client organizations at once">
  <defs>
    <linearGradient id="mcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100c1b"/>
      <stop offset="1" stop-color="#0a0810"/>
    </linearGradient>
    <radialGradient id="mcGlow" cx="30%" cy="26%" r="60%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mcTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1630"/>
      <stop offset="1" stop-color="#141026"/>
    </linearGradient>
    <filter id="mcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
  </defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}</style>

  <rect width="1200" height="750" fill="url(#mcBg)"/>
  <rect width="1200" height="750" fill="url(#mcGlow)"/>

  <!-- Console header -->
  <text x="140" y="150" fill="#f4f2fb" font-size="30" font-weight="700">Client organizations</text>
  <text x="140" y="186" fill="#8f88a6" font-size="19">One console · full isolation between tenants</text>
  <rect x="140" y="210" width="920" height="1.5" fill="#241f3a"/>

  <!-- Client tiles grid (3 x 2) -->
  <g filter="url(#mcShadow)">
    <!-- row 1 -->
    <g>
      <rect x="140" y="250" width="290" height="150" rx="18" fill="url(#mcTile)" stroke="#2a2440" stroke-width="1.5"/>
      <circle cx="184" cy="298" r="20" fill="#2b2350"/><text x="184" y="305" fill="#c9b8ff" font-size="19" font-weight="700" text-anchor="middle">N</text>
      <text x="220" y="292" fill="#e8e5f4" font-size="21" font-weight="600">Northwind Traders</text>
      <text x="220" y="320" fill="#8f88a6" font-size="16">240 users</text>
      <circle cx="398" cy="292" r="6" fill="#34d399"/>
      <rect x="184" y="352" width="210" height="8" rx="4" fill="#241f3a"/><rect x="184" y="352" width="150" height="8" rx="4" fill="#7c5cff"/>
    </g>
    <g>
      <rect x="450" y="250" width="290" height="150" rx="18" fill="url(#mcTile)" stroke="#2a2440" stroke-width="1.5"/>
      <circle cx="494" cy="298" r="20" fill="#2b2350"/><text x="494" y="305" fill="#c9b8ff" font-size="19" font-weight="700" text-anchor="middle">A</text>
      <text x="530" y="292" fill="#e8e5f4" font-size="21" font-weight="600">Acme Financial</text>
      <text x="530" y="320" fill="#8f88a6" font-size="16">1,120 users</text>
      <circle cx="708" cy="292" r="6" fill="#34d399"/>
      <rect x="494" y="352" width="210" height="8" rx="4" fill="#241f3a"/><rect x="494" y="352" width="176" height="8" rx="4" fill="#7c5cff"/>
    </g>
    <g>
      <rect x="760" y="250" width="290" height="150" rx="18" fill="url(#mcTile)" stroke="#2a2440" stroke-width="1.5"/>
      <circle cx="804" cy="298" r="20" fill="#2b2350"/><text x="804" y="305" fill="#c9b8ff" font-size="19" font-weight="700" text-anchor="middle">R</text>
      <text x="840" y="292" fill="#e8e5f4" font-size="21" font-weight="600">Riverside Clinic</text>
      <text x="840" y="320" fill="#8f88a6" font-size="16">86 users</text>
      <circle cx="1018" cy="292" r="6" fill="#fbbf24"/>
      <rect x="804" y="352" width="210" height="8" rx="4" fill="#241f3a"/><rect x="804" y="352" width="96" height="8" rx="4" fill="#7c5cff"/>
    </g>
    <!-- row 2 -->
    <g>
      <rect x="140" y="420" width="290" height="150" rx="18" fill="url(#mcTile)" stroke="#2a2440" stroke-width="1.5"/>
      <circle cx="184" cy="468" r="20" fill="#2b2350"/><text x="184" y="475" fill="#c9b8ff" font-size="19" font-weight="700" text-anchor="middle">C</text>
      <text x="220" y="462" fill="#e8e5f4" font-size="21" font-weight="600">Contoso Logistics</text>
      <text x="220" y="490" fill="#8f88a6" font-size="16">540 users</text>
      <circle cx="398" cy="462" r="6" fill="#34d399"/>
      <rect x="184" y="522" width="210" height="8" rx="4" fill="#241f3a"/><rect x="184" y="522" width="128" height="8" rx="4" fill="#7c5cff"/>
    </g>
    <g>
      <rect x="450" y="420" width="290" height="150" rx="18" fill="url(#mcTile)" stroke="#2a2440" stroke-width="1.5"/>
      <circle cx="494" cy="468" r="20" fill="#2b2350"/><text x="494" y="475" fill="#c9b8ff" font-size="19" font-weight="700" text-anchor="middle">F</text>
      <text x="530" y="462" fill="#e8e5f4" font-size="21" font-weight="600">Fabrikam Legal</text>
      <text x="530" y="490" fill="#8f88a6" font-size="16">312 users</text>
      <circle cx="708" cy="462" r="6" fill="#34d399"/>
      <rect x="494" y="522" width="210" height="8" rx="4" fill="#241f3a"/><rect x="494" y="522" width="162" height="8" rx="4" fill="#7c5cff"/>
    </g>
    <g>
      <rect x="760" y="420" width="290" height="150" rx="18" fill="#171327" stroke="#2a2440" stroke-width="1.5" stroke-dasharray="6 7"/>
      <circle cx="905" cy="480" r="22" fill="none" stroke="#7c5cff" stroke-width="2"/>
      <path d="M905 470 v20 M895 480 h20" stroke="#7c5cff" stroke-width="2" stroke-linecap="round"/>
      <text x="905" y="524" fill="#9a94ad" font-size="17" text-anchor="middle">Add a client</text>
    </g>
  </g>
</svg>
