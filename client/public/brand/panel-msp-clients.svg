<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="A multi-tenant console managing many client organizations, floating on a dark canvas">
  <defs>
    <radialGradient id="mcGlow" cx="34%" cy="30%" r="54%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mcTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171426"/>
      <stop offset="1" stop-color="#100d1c"/>
    </linearGradient>
    <filter id="mcShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}</style>

  <ellipse cx="420" cy="250" rx="520" ry="340" fill="url(#mcGlow)"/>

  <text x="150" y="150" fill="#f4f2fb" font-size="30" font-weight="700">Client organizations</text>
  <text x="150" y="186" fill="#8f88a6" font-size="19">One console · full isolation between tenants</text>
  <rect x="150" y="210" width="900" height="1.5" fill="#221d38"/>

  <g filter="url(#mcShadow)">
    <g>
      <rect x="150" y="250" width="290" height="150" rx="18" fill="url(#mcTile)" stroke="#26223a" stroke-width="1.5"/>
      <circle cx="194" cy="298" r="20" fill="#241d44"/><text x="194" y="305" fill="#c9b8ff" font-size="19" font-weight="700" text-anchor="middle">N</text>
      <text x="230" y="292" fill="#e8e5f4" font-size="21" font-weight="600">Northwind Traders</text>
      <text x="230" y="320" fill="#8f88a6" font-size="16">240 users</text>
      <circle cx="408" cy="292" r="6" fill="#34d399"/>
      <rect x="194" y="352" width="210" height="8" rx="4" fill="#1d1830"/><rect x="194" y="352" width="150" height="8" rx="4" fill="#7c5cff"/>
    </g>
    <g>
      <rect x="460" y="250" width="290" height="150" rx="18" fill="url(#mcTile)" stroke="#26223a" stroke-width="1.5"/>
      <circle cx="504" cy="298" r="20" fill="#241d44"/><text x="504" y="305" fill="#c9b8ff" font-size="19" font-weight="700" text-anchor="middle">A</text>
      <text x="540" y="292" fill="#e8e5f4" font-size="21" font-weight="600">Acme Financial</text>
      <text x="540" y="320" fill="#8f88a6" font-size="16">1,120 users</text>
      <circle cx="718" cy="292" r="6" fill="#34d399"/>
      <rect x="504" y="352" width="210" height="8" rx="4" fill="#1d1830"/><rect x="504" y="352" width="176" height="8" rx="4" fill="#7c5cff"/>
    </g>
    <g>
      <rect x="770" y="250" width="290" height="150" rx="18" fill="url(#mcTile)" stroke="#26223a" stroke-width="1.5"/>
      <circle cx="814" cy="298" r="20" fill="#241d44"/><text x="814" y="305" fill="#c9b8ff" font-size="19" font-weight="700" text-anchor="middle">R</text>
      <text x="850" y="292" fill="#e8e5f4" font-size="21" font-weight="600">Riverside Clinic</text>
      <text x="850" y="320" fill="#8f88a6" font-size="16">86 users</text>
      <circle cx="1028" cy="292" r="6" fill="#fbbf24"/>
      <rect x="814" y="352" width="210" height="8" rx="4" fill="#1d1830"/><rect x="814" y="352" width="96" height="8" rx="4" fill="#7c5cff"/>
    </g>
    <g>
      <rect x="150" y="420" width="290" height="150" rx="18" fill="url(#mcTile)" stroke="#26223a" stroke-width="1.5"/>
      <circle cx="194" cy="468" r="20" fill="#241d44"/><text x="194" y="475" fill="#c9b8ff" font-size="19" font-weight="700" text-anchor="middle">C</text>
      <text x="230" y="462" fill="#e8e5f4" font-size="21" font-weight="600">Contoso Logistics</text>
      <text x="230" y="490" fill="#8f88a6" font-size="16">540 users</text>
      <circle cx="408" cy="462" r="6" fill="#34d399"/>
      <rect x="194" y="522" width="210" height="8" rx="4" fill="#1d1830"/><rect x="194" y="522" width="128" height="8" rx="4" fill="#7c5cff"/>
    </g>
    <g>
      <rect x="460" y="420" width="290" height="150" rx="18" fill="url(#mcTile)" stroke="#26223a" stroke-width="1.5"/>
      <circle cx="504" cy="468" r="20" fill="#241d44"/><text x="504" y="475" fill="#c9b8ff" font-size="19" font-weight="700" text-anchor="middle">F</text>
      <text x="540" y="462" fill="#e8e5f4" font-size="21" font-weight="600">Fabrikam Legal</text>
      <text x="540" y="490" fill="#8f88a6" font-size="16">312 users</text>
      <circle cx="718" cy="462" r="6" fill="#34d399"/>
      <rect x="504" y="522" width="210" height="8" rx="4" fill="#1d1830"/><rect x="504" y="522" width="162" height="8" rx="4" fill="#7c5cff"/>
    </g>
    <g>
      <rect x="770" y="420" width="290" height="150" rx="18" fill="#0f0c1a" stroke="#26223a" stroke-width="1.5" stroke-dasharray="6 7"/>
      <circle cx="915" cy="480" r="22" fill="none" stroke="#7c5cff" stroke-width="2"/>
      <path d="M915 470 v20 M905 480 h20" stroke="#7c5cff" stroke-width="2" stroke-linecap="round"/>
      <text x="915" y="524" fill="#9a94ad" font-size="17" text-anchor="middle">Add a client</text>
