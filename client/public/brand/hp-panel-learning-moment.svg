<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="A phishing email with an instant Learning Moment tip card">
  <defs>
    <linearGradient id="lmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100c1b"/>
      <stop offset="1" stop-color="#0a0810"/>
    </linearGradient>
    <radialGradient id="lmGlow" cx="72%" cy="30%" r="60%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lmCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1730"/>
      <stop offset="1" stop-color="#141026"/>
    </linearGradient>
    <filter id="lmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}</style>

  <rect width="1200" height="750" fill="url(#lmBg)"/>
  <rect width="1200" height="750" fill="url(#lmGlow)"/>

  <!-- Mail window -->
  <g filter="url(#lmShadow)">
    <rect x="120" y="150" width="700" height="470" rx="22" fill="#141122" stroke="#2a2440" stroke-width="1.5"/>
    <circle cx="158" cy="188" r="6" fill="#3a3352"/><circle cx="180" cy="188" r="6" fill="#3a3352"/><circle cx="202" cy="188" r="6" fill="#3a3352"/>
    <rect x="120" y="216" width="700" height="1.5" fill="#241f3a"/>
    <text x="152" y="272" fill="#e8e5f4" font-size="22" font-weight="600">John Doe &lt;john.doe@company.com&gt;</text>
    <text x="152" y="312" fill="#c9b8ff" font-size="19" font-weight="600">Urgent: Action Required</text>
    <rect x="152" y="348" width="470" height="12" rx="6" fill="#211c34"/>
    <rect x="152" y="378" width="540" height="12" rx="6" fill="#211c34"/>
    <rect x="152" y="408" width="500" height="12" rx="6" fill="#211c34"/>
    <rect x="152" y="438" width="420" height="12" rx="6" fill="#211c34"/>
    <rect x="152" y="512" width="176" height="52" rx="10" fill="#7c5cff"/>
    <text x="240" y="545" fill="#ffffff" font-size="19" font-weight="600" text-anchor="middle">Review Now</text>
  </g>

  <!-- Learning Moment tip card -->
  <g filter="url(#lmShadow)">
    <rect x="600" y="250" width="480" height="330" rx="22" fill="url(#lmCard)" stroke="#3a2f66" stroke-width="1.5"/>
    <text x="640" y="322" fill="#f4f2fb" font-size="27" font-weight="700">Spotting Phishing Emails</text>
    <g>
      <rect x="640" y="356" width="26" height="26" rx="7" fill="#7c5cff"/>
      <path d="M646 369 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="682" y="376" fill="#d8d3ea" font-size="20">Check the sender's email address</text>
    </g>
    <g>
      <rect x="640" y="416" width="26" height="26" rx="7" fill="#7c5cff"/>
      <path d="M646 429 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="682" y="436" fill="#d8d3ea" font-size="20">Look for urgent language</text>
    </g>
    <g>
      <rect x="640" y="476" width="26" height="26" rx="7" fill="#7c5cff"/>
      <path d="M646 489 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="682" y="496" fill="#d8d3ea" font-size="20">Verify unexpected attachments</text>
    </g>
    <rect x="640" y="536" width="180" height="4" rx="2" fill="#2c2547"/>
  </g>
</svg>
