<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="A cyber-insurance evidence report with an improving click-rate trend and a compliance seal, floating on a dark canvas">
  <defs>
    <radialGradient id="evGlow" cx="70%" cy="28%" r="54%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="evCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171426"/>
      <stop offset="1" stop-color="#100d1c"/>
    </linearGradient>
    <filter id="evShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="38" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}</style>

  <ellipse cx="820" cy="250" rx="480" ry="340" fill="url(#evGlow)"/>

  <g filter="url(#evShadow)">
    <rect x="150" y="120" width="620" height="520" rx="24" fill="url(#evCard)" stroke="#26223a" stroke-width="1.5"/>
    <text x="190" y="188" fill="#f4f2fb" font-size="26" font-weight="700">Security Awareness — Evidence Pack</text>
    <text x="190" y="220" fill="#8f88a6" font-size="17">Campaign history · click-rate trend · training records</text>
    <rect x="190" y="242" width="540" height="1.5" fill="#221d38"/>

    <text x="190" y="292" fill="#c9b8ff" font-size="16" font-weight="600">Click rate — trending down</text>
    <polyline points="190,318 300,348 410,338 520,388 620,408 730,438" fill="none" stroke="#7c5cff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="730" cy="438" r="6" fill="#a78bfa"/>
    <line x1="190" y1="462" x2="730" y2="462" stroke="#221d38" stroke-width="1.5"/>

    <g>
      <path d="M196 510 l7 7 l12 -13" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="232" y="517" fill="#d8d3ea" font-size="19">Timestamped campaign log</text>
    </g>
    <g>
      <path d="M196 558 l7 7 l12 -13" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="232" y="565" fill="#d8d3ea" font-size="19">Training completion records</text>
    </g>
    <g>
      <path d="M196 606 l7 7 l12 -13" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="232" y="613" fill="#d8d3ea" font-size="19">White-labeled under your brand</text>
    </g>
  </g>

  <g filter="url(#evShadow)">
    <circle cx="910" cy="300" r="96" fill="#0f0c1a" stroke="#3a2f66" stroke-width="2"/>
    <circle cx="910" cy="300" r="72" fill="none" stroke="#7c5cff" stroke-width="2" stroke-dasharray="3 8"/>
    <path d="M878 300 l20 20 l40 -44" fill="none" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="910" y="430" fill="#9a94ad" font-size="18" text-anchor="middle">Compliance certificate</text>
  </g>
</svg>
