<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="A cyber-insurance evidence report with an improving click-rate trend and a compliance seal">
  <defs>
    <linearGradient id="evBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100c1b"/>
      <stop offset="1" stop-color="#0a0810"/>
    </linearGradient>
    <radialGradient id="evGlow" cx="70%" cy="24%" r="60%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="evCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1630"/>
      <stop offset="1" stop-color="#141026"/>
    </linearGradient>
    <filter id="evShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}</style>

  <rect width="1200" height="750" fill="url(#evBg)"/>
  <rect width="1200" height="750" fill="url(#evGlow)"/>

  <!-- Document -->
  <g filter="url(#evShadow)">
    <rect x="180" y="120" width="620" height="510" rx="22" fill="url(#evCard)" stroke="#2a2440" stroke-width="1.5"/>
    <text x="220" y="188" fill="#f4f2fb" font-size="26" font-weight="700">Security Awareness — Evidence Pack</text>
    <text x="220" y="220" fill="#8f88a6" font-size="17">Campaign history · click-rate trend · training records</text>
    <rect x="220" y="242" width="540" height="1.5" fill="#241f3a"/>

    <!-- Trend chart -->
    <text x="220" y="292" fill="#c9b8ff" font-size="16" font-weight="600">Click rate — trending down</text>
    <polyline points="220,318 330,348 440,338 550,388 650,408 760,438" fill="none" stroke="#7c5cff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="760" cy="438" r="6" fill="#a78bfa"/>
    <line x1="220" y1="452" x2="760" y2="452" stroke="#241f3a" stroke-width="1.5"/>

    <!-- Record rows -->
    <g>
      <path d="M226 500 l7 7 l12 -13" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="262" y="507" fill="#d8d3ea" font-size="19">Timestamped campaign log</text>
    </g>
    <g>
      <path d="M226 548 l7 7 l12 -13" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="262" y="555" fill="#d8d3ea" font-size="19">Training completion records</text>
    </g>
    <g>
      <path d="M226 596 l7 7 l12 -13" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="262" y="603" fill="#d8d3ea" font-size="19">White-labeled under your brand</text>
    </g>
  </g>

  <!-- Seal -->
  <g filter="url(#evShadow)">
    <circle cx="900" cy="300" r="96" fill="#161227" stroke="#3a2f66" stroke-width="2"/>
    <circle cx="900" cy="300" r="72" fill="none" stroke="#7c5cff" stroke-width="2" stroke-dasharray="3 8"/>
    <path d="M868 300 l20 20 l40 -44" fill="none" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="900" y="430" fill="#9a94ad" font-size="18" text-anchor="middle">Compliance certificate</text>
  </g>
</svg>
