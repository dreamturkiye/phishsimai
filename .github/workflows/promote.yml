name: promote-to-prod
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.MARCUS_PAT }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pending migrations to PROD DB (tracked runner)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/apply-migrations.mjs
      - name: Promote dev -> main (open/reuse PR, auto-merge)
        env:
          GH_TOKEN: ${{ secrets.MARCUS_PAT }}
        run: |
          git fetch origin main dev -q
          if [ "$(git rev-parse origin/dev)" = "$(git rev-parse origin/main)" ]; then
            echo "dev == main, nothing to promote"; exit 0
          fi
          PR=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base main --head dev \
              --title "promote: dev -> main" \
              --body "Automated promotion. Pending migrations applied to prod DB before this merges."
            PR=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          fi
          echo "Promotion PR: #$PR"
          gh pr merge "$PR" --auto --merge
