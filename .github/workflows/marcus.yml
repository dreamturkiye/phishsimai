name: Marcus
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Marcus"
        required: true
      task_id:
        description: "agent_tasks id (optional)"
        required: false

concurrency:
  group: marcus
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  marcus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.MARCUS_PAT }}
      - name: Create task branch
        run: |
          git config user.name "marcus-bot"
          git config user.email "marcus@phishsimai.com"
          git checkout -b "marcus/task-${{ github.run_id }}"
      - name: Marcus edits files
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are Marcus, the autonomous engineer for PhishSimAI.

            TASK:
            ${{ github.event.inputs.task }}

            Rules:
            - Make the MINIMAL correct change. Edit or create files only.
            - Do NOT run git, do NOT commit, do NOT open a PR. The workflow does all of that.
            - Do NOT edit: .github/, ci/, vercel.json, server/os/kaan-os-core/, or any path
              containing billing, stripe, price, pricing, or legal.
            - When the edit is complete, just stop.
          claude_args: "--max-turns 15 --model claude-sonnet-5"
      - name: Commit, push, PR, auto-merge
        env:
          GH_TOKEN: ${{ secrets.MARCUS_PAT }}
        run: |
          BR="marcus/task-${{ github.run_id }}"
          git add -A
          git commit -m "marcus: ${{ github.event.inputs.task }}" || true
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev)" ]; then
            echo "::error::Marcus made no changes"; exit 1
          fi
          git push origin "$BR"
          gh pr create --base dev --head "$BR" \
            --title "marcus: ${{ github.event.inputs.task }}" \
            --body "task_id=${{ github.event.inputs.task_id }}" --label marcus
          gh pr merge "$BR" --auto --squash
