name: Marcus
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Marcus"
        required: true
      task_id:
        description: "agent_tasks id (optional)"
        required: false

concurrency:
  group: marcus
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  marcus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MARCUS_PAT }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create task branch
        run: |
          git config user.name "marcus-bot"
          git config user.email "marcus@phishsimai.com"
          git checkout -b "marcus/task-${{ github.run_id }}"
      - name: Marcus edits files
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK: ${{ github.event.inputs.task }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "You are Marcus, the autonomous engineer for PhishSimAI. TASK: $TASK  Make the minimal correct change to accomplish the task. Create or edit files only. If the change needs a new DB column/table, also add a drizzle/pg migration file whose SQL is additive and idempotent (use IF NOT EXISTS). Do NOT run git, do NOT commit, do NOT open a PR - the workflow does that. Do NOT edit .github/, ci/, vercel.json, scripts/apply-migrations.mjs, server/os/kaan-os-core/, or any path containing billing, stripe, price, pricing, or legal. When done, stop." --model claude-sonnet-5 --dangerously-skip-permissions
      - name: Apply pending migrations to PROD DB (before code can deploy)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/apply-migrations.mjs
      - name: Commit, push, PR into main, auto-merge
        env:
          GH_TOKEN: ${{ secrets.MARCUS_PAT }}
        run: |
          BR="marcus/task-${{ github.run_id }}"
          git add -A
          git commit -m "marcus: ${{ github.event.inputs.task }}" || true
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "::error::Marcus made no changes"; exit 1
          fi
          git push origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "marcus: ${{ github.event.inputs.task }}" \
            --body "task_id=${{ github.event.inputs.task_id }}" --label marcus
          gh pr merge "$BR" --auto --squash
